<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulso Promos — telas em 5 paletas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ui-bg:#0E0E13; --ui-surf:#171720; --ui-line:#2C2C3A; --ui-txt:#F4F4F7; --ui-sec:#A2A2B4; --ui-acc:#7C5CFF;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --ui-bg:#F5F5F3; --ui-surf:#FFFFFF; --ui-line:#DEDCD5; --ui-txt:#17191A; --ui-sec:#5A5F60; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--ui-bg);color:var(--ui-txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
header.bar{position:sticky;top:0;z-index:20;background:var(--ui-surf);border-bottom:1px solid var(--ui-line);padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px}
.bar h1{margin:0 0 2px;font-size:17px;font-weight:600}
.bar p{margin:0 0 10px;font-size:12px;color:var(--ui-sec)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button.tab{font:inherit;font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--ui-line);background:transparent;color:var(--ui-sec);cursor:pointer}
button.tab[aria-pressed="true"]{background:var(--ui-acc);border-color:var(--ui-acc);color:#fff}
.sep{width:1px;height:22px;background:var(--ui-line)}
select{font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--ui-line);background:var(--ui-surf);color:var(--ui-txt)}
main{padding:20px;max-width:1600px;margin:0 auto}
.note{font-size:12px;color:var(--ui-sec);margin:0 0 18px}
.block{margin:0 0 28px}
.block h2{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--ui-txt)}
.holder{overflow:hidden;border-radius:12px;border:1px solid var(--ui-line);background:#000}
.scaler{transform-origin:top left}
.cmp{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){ .cmp{grid-template-columns:1fr} }
.cmp .tagline{font-size:12px;color:var(--ui-sec);margin:0 0 6px}

/* ---------- telas ---------- */
.theme{
  --shopee:#EE4D2D; --ali:#E62E04; --ml:#FFE600; --amz:#FF9900;
}
.frame{width:1440px;font-family:Inter,sans-serif;background:var(--bg);color:var(--txt);display:flex;overflow:hidden}
.frame.mobile{width:390px;display:block}
.app{display:flex;width:100%}
.side{width:240px;background:var(--surf);padding:24px 16px;display:flex;flex-direction:column;gap:24px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:22px;height:22px;border-radius:50%;background:var(--acc);flex:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{padding:10px 12px;border-radius:8px;font-size:14px;color:var(--sec);text-decoration:none}
.nav a.on{background:var(--accSoft);color:var(--acc);font-weight:500}
.side .spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--elev)}
.me .av{width:24px;height:24px;border-radius:50%;background:var(--bStrong)}
.me b{font-size:13px;font-weight:500;display:block}
.me span{font-size:11px;color:var(--muted)}
.main{flex:1;padding:28px;display:flex;flex-direction:column;gap:20px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.top h1{margin:0;font-size:24px;font-weight:600}
.top .sub{font-size:13px;color:var(--sec);margin-top:4px}
.btn{font-size:13px;font-weight:500;padding:10px 16px;border-radius:8px;background:var(--acc);color:var(--onAcc);display:inline-block}
.btn.ghost{background:var(--surf);border:1px solid var(--bord);color:var(--sec)}
.btn.block{display:block;text-align:center}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font-size:15px;font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpi b{font-size:26px;font-weight:600;display:block}
.kpi .lab{font-size:12px;color:var(--sec);font-weight:500}
.kpi .d{font-size:12px}
.chip{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:500;background:var(--elev);color:var(--sec)}
.chip.ok{background:var(--okSoft);color:var(--ok)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.dang{background:var(--dangSoft);color:var(--dang)}
.chip.acc{background:var(--accSoft);color:var(--acc)}
.tbl{background:var(--surf);border:1px solid var(--bord);border-radius:12px;overflow:hidden}
.tbl .th,.tbl .tr{display:flex;gap:12px;align-items:center;padding:14px 18px}
.tbl .th{background:var(--elev);padding:12px 18px;font-size:11px;color:var(--muted);font-weight:500}
.tbl .tr{border-top:1px solid var(--bord);font-size:13px;color:var(--sec)}
.tbl .tr b{color:var(--txt);font-weight:500;font-size:14px}
.tbl .tr small{color:var(--muted);font-size:11px;display:block}
.pill{padding:9px 14px;border-radius:8px;border:1px solid var(--bord);background:var(--surf);font-size:12px;color:var(--sec)}
.input{padding:10px 14px;border-radius:8px;border:1px solid var(--bord);background:var(--input);font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted);font-size:12px}
.sec{color:var(--sec);font-size:12px}
.big{font-size:20px;font-weight:600;color:var(--ok)}
.tog{width:38px;height:22px;border-radius:11px;background:var(--bStrong);position:relative;flex:none}
.tog.on{background:var(--acc)}
.tog i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--txt)}
.tog.on i{left:19px;background:var(--onAcc)}
.tog.lock{background:var(--elev)} .tog.lock i{background:var(--muted)}
.banner{padding:12px 14px;border-radius:10px;font-size:12px}
.ph{background:var(--elev);border-radius:10px}
/* avatar do leitor + menu suspenso */
.avatarDD{position:relative;list-style:none}
.avatarDD summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--sec);font-size:12px}
.avatarDD summary::-webkit-details-marker{display:none}
.avatarDD .avImg{width:36px;height:36px;border-radius:50%;background:var(--acc);flex:none}
.avatarDD .menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:6px;width:160px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5}
.avatarDD .menu a{display:block;padding:9px 10px;border-radius:6px;font-size:13px;color:var(--sec);text-decoration:none}
.avatarDD .menu a:hover{background:var(--elev);color:var(--txt)}
/* página de produto */
.pTop{display:flex;gap:24px;align-items:flex-start}
.pImg{width:640px;height:420px;flex:none}
.pInfo{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.pActions{display:flex;gap:10px}
.pcGrid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.pcCol{display:flex;flex-direction:column;gap:8px}
.pcItem{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sec)}
.specsGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.specsRow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.videoCard{border:1px dashed var(--bStrong);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
/* seções da página de produto */
.section{display:flex;flex-direction:column;gap:12px}
.sectionTitle{font-size:21px;font-weight:600;color:var(--txt);margin:0;letter-spacing:-.01em}
.histGrid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;height:480px}
.histGrid > .card{height:100%;overflow:hidden}
.storesScroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px;margin-top:2px}
.storeRow{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--bord);background:var(--elev);flex:none}
.storeRow.best{border:2px solid var(--acc);background:var(--accSoft);box-shadow:0 0 0 1px var(--acc),0 0 20px -4px var(--acc)}
.bestBadge{position:absolute;top:-11px;right:14px;background:var(--acc);color:var(--onAcc);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
/* cupom em modal */
.couponWrap{position:relative;display:inline-block}
.couponModalBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:50}
.couponModal{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:22px;width:340px;display:flex;flex-direction:column;gap:14px}
.couponModal h3{margin:0;font-size:16px}
.modalClose{cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
.couponCode{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;background:var(--input);border:1px dashed var(--bStrong);cursor:pointer}
.couponCode .couponCodeText{font-size:16px;font-weight:600;color:var(--txt);letter-spacing:.02em}
.copyHint{font-size:12px;color:var(--acc);font-weight:500}
.couponNote{font-size:12px;color:var(--sec)}
.couponWarn{font-size:11px;color:var(--muted)}
.authModalBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:60}
.authModal{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:26px;width:380px;display:flex;flex-direction:column;gap:14px;text-align:left}
.authModal h3{margin:0;font-size:19px;font-weight:700;line-height:1.32}
.authBenefitBox{border:1px solid var(--bord);border-radius:10px;padding:14px 16px}
.authBenefitRow{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;color:var(--txt)}
.authBenefitIcon{color:var(--acc);font-size:15px;flex:none}
.authBenefits div{display:flex;gap:8px;align-items:flex-start}
/* perfil e favoritos */
.favWrap{display:flex;gap:24px;align-items:flex-start}
.profCard{width:280px;flex:none;background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.profAv{width:56px;height:56px;border-radius:50%;background:var(--acc)}
.favTabs{display:flex;gap:6px}
.favTabs span{padding:8px 12px;border-radius:8px;font-size:12px;color:var(--sec)}
.favTabs span.on{background:var(--accSoft);color:var(--acc);font-weight:500}
.favGrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.favCard{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.favImg{height:130px}
.heart{color:var(--dang);font-size:14px}
/* login */
.login{width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.loginCard{width:420px;background:var(--surf);border:1px solid var(--bord);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:20px}
/* site */
.site{display:block;width:100%}
.sHead{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:16px 40px;background:var(--surf)}
.sNav{display:flex;gap:22px;font-size:13px;color:var(--sec)}
.sBody{padding:28px 40px 40px;display:flex;flex-direction:column;gap:20px}
.offers{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.offer{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.offer .img{height:150px}
.offer h4{margin:0;font-size:14px;font-weight:500}
/* telegram */
.tg{background:var(--bg);min-height:844px}
.tgHead{display:flex;align-items:center;gap:10px;padding:44px 16px 12px;background:var(--surf)}
.tgHead .av{width:34px;height:34px;border-radius:50%;background:var(--acc)}
.tgBody{padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.bubble{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kb{display:flex;flex-direction:column;gap:8px}
.kb .rowb{display:flex;gap:8px}
.kb .rowb > *{flex:1;text-align:center;font-size:12px;padding:10px;border-radius:8px}
.priceChangeRow{font-size:12px;color:var(--sec);margin-top:-4px}
.chart{position:relative;height:210px;margin-top:4px}
.chart .gl{position:absolute;left:46px;right:0;height:1px;background:var(--bord)}
.chart .gl span{position:absolute;left:0;top:-8px;width:38px;text-align:right;font-size:10px;color:var(--muted)}
.chart svg{position:absolute;left:46px;top:0;right:0;height:100%}

/* ======================================================================
   Composições exclusivas do site público por conceito (Silver / Gold / Sale)
   As classes funcionais (couponWrap, priceCardWrap, storeRow, priceDisplay,
   tog, avatarDD, favCard...) continuam as mesmas — só a casca visual muda.
   ====================================================================== */
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');

/* ---------- SILVER LUXURY ---------- */
.slv-page{font-family:'Manrope',sans-serif}
.slv-page .serif{font-family:'DM Serif Display',serif;font-style:italic}
.slv-header{display:flex;align-items:center;justify-content:space-between;padding:26px 48px;border-bottom:1px solid var(--bord)}
.slv-mark{font-family:'DM Serif Display',serif;font-size:18px}
.slv-nav{display:flex;gap:32px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.slv-nav span:first-child{color:var(--txt)}
.slv-hero{position:relative;padding:70px 48px 84px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;overflow:hidden}
.slv-hero::before{content:'';position:absolute;top:-40%;right:0;width:46%;height:180%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 12%,transparent) 0%,transparent 70%)}
.slv-h1{position:relative;font-family:'DM Serif Display',serif;font-size:36px;line-height:1.15;margin:0 0 14px;font-weight:400;max-width:520px}
.slv-rule{position:relative;width:56px;height:1px;background:linear-gradient(90deg,var(--acc),transparent);margin:0 0 14px}
.slv-sub{position:relative;font-size:13.5px;line-height:1.7;color:var(--sec);margin:0;max-width:420px}
.slv-ring{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--acc) 45%,transparent),transparent 65%);border:1px solid var(--bord)}
.slv-pagehead{padding:44px 48px 30px;border-bottom:1px solid var(--bord)}
.slv-pagehead .crumb{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.slv-pagehead h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;margin:0}
.slv-body{padding:44px 48px 70px}
.slv-section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 28px;border-bottom:1px solid var(--bord);padding-bottom:16px}
.slv-section-head h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:21px;margin:0}
.slv-section-head span{font-size:11.5px;color:var(--muted)}
.slv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bord)}
.slv-card{background:var(--bg);padding:22px;display:flex;flex-direction:column;gap:12px}
.slv-card-art{height:150px;background:linear-gradient(160deg,var(--elev),var(--bg) 70%);border:1px solid var(--bord);position:relative;overflow:hidden}
.slv-card-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.slv-card-name{font-size:14.5px;font-weight:500;margin:0}
.slv-card-price{display:flex;align-items:baseline;gap:8px}
.slv-card-price b{font-size:18px;font-weight:600;color:var(--txt)}
.slv-page .btn{border-radius:2px;background:var(--acc);color:var(--onAcc);font-weight:600}
.slv-page .btn.ghost{background:transparent;border:1px solid var(--acc);color:var(--txt)}
.slv-page .couponModal,.slv-page .couponCode,.slv-page .card{border-radius:2px}
.slv-page .storeRow{border-radius:2px}
.slv-page .storeRow.best{border-width:1px}
.slv-panel{border:1px solid var(--bord);padding:26px;background:var(--bg)}
.slv-two{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
.slv-profile{border:1px solid var(--bord);padding:26px;display:flex;flex-direction:column;gap:14px;width:260px;flex:none}
.slv-avatar{width:48px;height:48px;border-radius:50%;background:var(--acc)}

/* ---------- GOLD PREMIUM ---------- */
.gld-page{font-family:'Montserrat',sans-serif}
.gld-topline{text-align:center;padding:9px;font-size:10px;letter-spacing:.12em;color:var(--acc);border-bottom:1px solid var(--bord)}
.gld-header{text-align:center;padding:22px 40px 18px}
.gld-mark{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:500;color:var(--txt)}
.gld-rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:13px auto}
.gld-nav{display:flex;justify-content:center;gap:28px;font-size:11px;letter-spacing:.04em;color:var(--sec)}
.gld-hero{display:grid;grid-template-columns:.9fr 1fr;align-items:stretch}
.gld-hero-copy{padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
.gld-h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-style:italic;font-weight:500;line-height:1.18;margin:0 0 16px;color:var(--txt)}
.gld-sub{font-size:13px;line-height:1.8;color:var(--sec);max-width:340px;margin:0}
.gld-hero-art{position:relative;background:radial-gradient(ellipse at 50% 30%,var(--elev) 0%,var(--bg) 75%);padding:34px;display:flex;align-items:center;justify-content:center}
.gld-frame{width:100%;max-width:210px;aspect-ratio:4/5;border:1px solid var(--acc);padding:9px}
.gld-frame-inner{width:100%;height:100%;background:radial-gradient(circle at 40% 30%,var(--elev),var(--bg) 75%)}
.gld-pagehead{text-align:center;padding:38px 40px 26px;border-bottom:1px solid var(--bord)}
.gld-pagehead .crumb{font-size:10.5px;color:var(--muted);margin-bottom:10px}
.gld-pagehead h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:27px;margin:0;color:var(--txt)}
.gld-body{padding:50px 48px 70px}
.gld-section-head{text-align:center;margin-bottom:32px}
.gld-section-head h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:23px;color:var(--txt);margin:0 0 6px}
.gld-section-head span{font-size:11px;color:var(--muted);letter-spacing:.02em}
.gld-grid{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.gld-card{width:220px;text-align:left}
.gld-card-frame{aspect-ratio:3/4;border:1px solid var(--bord);padding:7px;margin-bottom:14px}
.gld-card-art{width:100%;height:100%;background:radial-gradient(circle at 35% 25%,var(--elev),var(--bg) 75%)}
.gld-card-store{font-size:10px;letter-spacing:.05em;color:var(--acc);margin-bottom:6px}
.gld-card-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--txt);margin:0 0 8px;font-weight:500}
.gld-card-price{font-size:16px;color:var(--acc);font-weight:500}
.gld-page .btn{background:var(--acc);color:var(--onAcc);border-radius:1px;font-weight:600;letter-spacing:.03em}
.gld-page .btn.ghost{background:transparent;border:1px solid var(--acc);color:var(--txt)}
.gld-page .card,.gld-page .couponModal,.gld-page .storeRow{border-radius:2px}
.gld-panel{border:1px solid var(--bord);padding:30px;background:var(--bg2,var(--surf))}

// ---- gráfico de histórico de preço: preço à vista + preço parcelado, com filtro de período ----
function niceGridlines(minY,maxY,count){
  const arr=[];
  for(let i=0;i<count;i++){ arr.push(Math.round((minY+(maxY-minY)*(i/(count-1)))/10)*10); }
  return arr;
}
function buildDateLabels(n){
  const end = new Date(2026,8,21); // 21 de setembro de 2026, 1 ponto por dia
  return Array.from({length:n},(_,i)=> new Date(end.getTime() - (n-1-i)*86400000))
    .map(d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.',''));
}
function dateAxisRow(n){
  const labels = buildDateLabels(n);
  const idx = [...new Set([0, Math.round((n-1)*0.25), Math.round((n-1)*0.5), Math.round((n-1)*0.75), n-1])];
  return `<div class="between muted axisRow">${idx.map(i=>`<span>${labels[i]}</span>`).join('')}</div>`;
}
function priceLegend(){
  return `<div class="row" style="gap:14px">
    <div class="row" style="gap:6px"><i style="width:12px;height:2px;background:var(--acc);display:inline-block"></i><span class="muted">Preço à vista</span></div>
    <div class="row" style="gap:6px"><i style="width:12px;height:2px;background:var(--line2);display:inline-block;background-image:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 7px)"></i><span class="muted">Preço parcelado</span></div>
  </div>`;
}
function priceChartInner(cash, inst, w, h, minY, maxY){
  const yOf = v => (h - ((v-minY)/(maxY-minY))*h).toFixed(1);
  const xOf = i => ((w/(cash.length-1))*i).toFixed(1);
  const grid = niceGridlines(minY,maxY,4);
  const gridHTML = grid.map(v=>`<div class="gl" style="top:${yOf(v)}px"><span>R$ ${v}</span></div>`).join('');
  const ptsA = cash.map((p,i)=>`${xOf(i)},${yOf(p)}`).join(' ');
  const ptsB = inst.map((p,i)=>`${xOf(i)},${yOf(p)}`).join(' ');
  const lx=xOf(cash.length-1), lyA=yOf(cash[cash.length-1]), lyB=yOf(inst[inst.length-1]);
  return `${gridHTML}
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${ptsB}" fill="none" stroke="var(--line2)" stroke-width="2" stroke-dasharray="5 4"/>
      <polyline points="${ptsA}" fill="none" stroke="var(--acc)" stroke-width="2"/>
      <circle cx="${lx}" cy="${lyB}" r="4" fill="var(--line2)"/>
      <circle cx="${lx}" cy="${lyA}" r="4" fill="var(--acc)"/>
    </svg>`;
}
// gerador determinístico (mesma "aleatoriedade" sempre, para o gráfico não pular a cada render)
function seededRandom(seed){
  let t = seed>>>0;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ t>>>15, 1 | t);
    r = (r + Math.imul(r ^ r>>>7, 61 | r)) ^ r;
    return ((r ^ r>>>14) >>> 0) / 4294967296;
  };
}
function genDailySeries(days, endCash, startCash, seed, volatility){
  const rnd = seededRandom(seed);
  const arr=[];
  for(let i=0;i<days;i++){
    const trend = startCash + (endCash-startCash)*(i/(days-1));
    arr.push(Math.max(1, Math.round(trend + (rnd()-0.5)*volatility)));
  }
  arr[arr.length-1] = endCash; // preço de hoje é o que o catálogo mostra
  return arr;
}
// cartão de histórico completo, com filtro de período (1 ano / 6 meses / 3 meses / 30 dias)
const PERIOD_LABELS = {365:'No último ano',182:'Nos últimos 6 meses',90:'Nos últimos 3 meses',30:'Nos últimos 30 dias'};
function priceChangeHTML(cash, inst, days){
  const label = PERIOD_LABELS[days] || ('Nos últimos '+days+' dias');
  const pct = arr => ((arr[arr.length-1]-arr[0])/arr[0])*100;
  const fmt = p => {
    if(Math.abs(p)<0.05) return {text:'sem variação', tone:'muted'};
    const dir = p<0 ? 'mais barato' : 'mais caro';
    const tone = p<0 ? 'ok' : 'dang';
    return {text: Math.abs(p).toFixed(1).replace('.',',')+'% '+dir, tone};
  };
  const c = fmt(pct(cash)), i = fmt(pct(inst));
  return `<div class="priceChangeRow">${label}: <b style="color:var(--${c.tone})">à vista ${c.text}</b> · <b style="color:var(--${i.tone})">parcelado ${i.text}</b></div>`;
}
function priceCardHTML(cashFull, instFull, w, h, defaultDays, opts){
  opts = opts || {};
  const withTitle = opts.withTitle !== false;
  const cash = cashFull.slice(-defaultDays);
  const inst = instFull.slice(-defaultDays);
  const allVals=[...cash,...inst];
  const minY=Math.floor(Math.min(...allVals)/10)*10-10, maxY=Math.ceil(Math.max(...allVals)/10)*10+10;
  const series = JSON.stringify({cash:cashFull, inst:instFull});
  const opt=(v,label)=>`<option value="${v}"${v===defaultDays?' selected':''}>${label}</option>`;
  const filterSelect = `<select class="pill rangeSelect" onchange="pulsoUpdateChart(this)" style="font:inherit;color:var(--sec);border-radius:8px">${opt(365,'1 ano')}${opt(182,'6 meses')}${opt(90,'3 meses')}${opt(30,'30 dias')}</select>`;
  const headerHTML = withTitle
    ? `<div class="between"><h3>Histórico de preços</h3>${priceLegend()}</div><div class="row" style="justify-content:flex-end;margin-top:-6px">${filterSelect}</div>`
    : `<div class="between">${priceLegend()}${filterSelect}</div>`;
  return `<div class="card priceCardWrap" data-series='${series}' data-w="${w}" data-h="${h}">
    ${headerHTML}
    ${priceChangeHTML(cash, inst, defaultDays)}
    <div class="chart" style="height:${h}px">${priceChartInner(cash,inst,w,h,minY,maxY)}</div>
    ${dateAxisRow(cash.length)}
  </div>`;
}
// troca o período do gráfico sem re-renderizar a tela inteira
function pulsoUpdateChart(sel){
  const wrap = sel.closest('.priceCardWrap');
  if(!wrap) return;
  const data = JSON.parse(wrap.getAttribute('data-series'));
  const days = parseInt(sel.value,10);
  const cash = data.cash.slice(-days), inst = data.inst.slice(-days);
  const w = parseInt(wrap.dataset.w,10), h = parseInt(wrap.dataset.h,10);
  const allVals=[...cash,...inst];
  const minY=Math.floor(Math.min(...allVals)/10)*10-10, maxY=Math.ceil(Math.max(...allVals)/10)*10+10;
  wrap.querySelector('.priceChangeRow').outerHTML = priceChangeHTML(cash, inst, days);
  wrap.querySelector('.chart').innerHTML = priceChartInner(cash,inst,w,h,minY,maxY);
  wrap.querySelector('.axisRow').outerHTML = dateAxisRow(cash.length);
}
// alterna entre preço à vista e preço parcelado na página de produto
function pulsoSetPriceMode(btn, mode){
  const toggleRow = btn.parentElement;
  [...toggleRow.children].forEach(c=>{ c.className='btn ghost'; });
  btn.className='btn';
  const disp = toggleRow.parentElement.querySelector('.priceDisplay');
  if(!disp) return;
  const d = disp.dataset;
  const big = disp.querySelector('.bigPrice');
  const sub = disp.querySelector('.priceSub');
  if(mode==='cash'){ big.textContent = 'R$ '+d.cash; sub.textContent=''; }
  else { big.textContent = 'R$ '+d.instTotal; sub.textContent = 'em '+d.instN+'x de R$ '+d.instEach; }
}

function pulsoCopyCoupon(el){
  const codeEl = el.querySelector('.couponCodeText');
  const hint = el.querySelector('.copyHint');
  if(!codeEl || !hint) return;
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(codeEl.textContent); } }catch(err){}
  const original = hint.textContent;
  hint.textContent = 'Copiado!';
  setTimeout(()=>{ hint.textContent = original; }, 1500);
}

const NAMES = Object.keys(SCREENS);
const slug = n => 'scr-' + n.replace(/[^a-zA-Z0-9]+/g,'-');
const state = { mode:'pal', pal:'silver', scr:NAMES[8] };

const palSeg = document.getElementById('palSeg');
Object.entries(PALS).forEach(([k,p])=>{
  const b=document.createElement('button');
  b.className='tab'; b.textContent=p.nome; b.dataset.pal=k;
  b.setAttribute('aria-pressed', k===state.pal ? 'true':'false');
  b.addEventListener('click',()=>{ state.pal=k; sync(); });
  palSeg.appendChild(b);
});
const sel = document.getElementById('scr');
NAMES.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
sel.value = state.scr;
sel.addEventListener('change',()=>{
  state.scr=sel.value;
  if(state.mode==='pal'){ const el=document.getElementById(slug(sel.value)); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
  else { render(); }
});
document.querySelectorAll('#modeSeg .tab').forEach(b=>{
  b.addEventListener('click',()=>{ state.mode=b.dataset.mode; sync(); });
});

function vars(k){ return Object.entries(PALS[k].v).map(([n,v])=>`--${n}:${v}`).join(';'); }

function board(palKey, screenName, colWidth){
  const wrap = document.createElement('div');
  const holder = document.createElement('div');
  holder.className = 'holder';
  const scaler = document.createElement('div');
  scaler.className = 'scaler theme';
  scaler.style.cssText = vars(palKey);
  const siteVariant = SITE_SCREENS_BY_PAL[screenName];
  scaler.innerHTML = (siteVariant && siteVariant[palKey]) ? siteVariant[palKey] : SCREENS[screenName];
  holder.appendChild(scaler);
  wrap.appendChild(holder);
  requestAnimationFrame(()=>{
    const frame = scaler.querySelector('.frame');
    const natural = frame.offsetWidth || 1440;
    const s = colWidth / natural;
    scaler.style.transform = `scale(${s})`;
    holder.style.height = (frame.offsetHeight * s) + 'px';
  });
  return wrap;
}

function render(){
  const stage = document.getElementById('stage');
  const note = document.getElementById('note');
  stage.innerHTML='';
  const w = stage.clientWidth || 1200;
  if(state.mode==='pal'){
    note.textContent = PALS[state.pal].nome + ' — ' + PALS[state.pal].ideia + '. As ' + NAMES.length + ' telas abaixo usam essa paleta.';
    NAMES.forEach(n=>{
      const block=document.createElement('div'); block.className='block'; block.id=slug(n);
      const h=document.createElement('h2'); h.textContent=n; block.appendChild(h);
      const colW = n.indexOf('Telegram')>-1 ? Math.min(420, w) : w;
      block.appendChild(board(state.pal, n, colW));
      stage.appendChild(block);
    });
  } else {
    note.textContent = state.scr + ' — a mesma tela nas 4 paletas, para comparar lado a lado.';
    const grid=document.createElement('div'); grid.className='cmp';
    const colW = (w - 16) / 2;
    Object.keys(PALS).forEach(k=>{
      const cell=document.createElement('div');
      const t=document.createElement('p'); t.className='tagline'; t.textContent=PALS[k].nome+' · '+PALS[k].ideia;
      cell.appendChild(t);
      cell.appendChild(board(k, state.scr, colW));
      grid.appendChild(cell);
    });
    stage.appendChild(grid);
  }
}

function sync(){
  document.querySelectorAll('#palSeg .tab').forEach(b=>b.setAttribute('aria-pressed', b.dataset.pal===state.pal?'true':'false'));
  document.querySelectorAll('#modeSeg .tab').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===state.mode?'true':'false'));
  render();
}
let t; window.addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(render,180); });
sync();
</script>
