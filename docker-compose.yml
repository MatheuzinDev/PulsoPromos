services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulso}
      POSTGRES_DB: ${POSTGRES_DB:-pulso}
    ports:
      - "5432:5432"
    volumes:
      - pulso_pgdata:/var/lib/postgresql/data

volumes:
  pulso_pgdata:
